name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run tests
      # `--all-features` also exercises the `capabilities` feature (off by default), so the
      # ForensicTool/MCP surface is covered without needing it enabled for every consumer.
      run: cargo test --all-features --verbose

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
